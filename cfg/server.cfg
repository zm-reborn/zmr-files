hostname "Zombie Master: Reborn Server"
maxplayers 16


// How many seconds after the round start can players still spawn as a survivor. (late-joining)
zm_sv_joingrace 60

// Round limit per map. 0 = Disable
zm_mp_roundlimit 0

// Time limit per map. 0 = Disable
mp_timelimit 0

// Let all players talk regardless of team.
sv_alltalk 1 

// Let spectators spectate in free cam
mp_forcecamera 0 

// Regular falldamage
mp_falldamage 1

//Default Zombie Popcap
zm_sv_zombiemax 70

// Default ZM resource values
zm_sv_resource_rate 5
zm_sv_resource_max 5000
zm_sv_resource_init 100

//Default ZM ability costs
zm_sv_physexp_cost 400
zm_sv_cost_hiddenshambler 100

// Default flashlight values
zm_sv_flashlightdrainrate 0.6
zm_sv_flashlightrechargerate 2.5

// Change to zero if you don't like fun. (Disables automatic santahats)
zm_sv_happyzombies_usedate 1
